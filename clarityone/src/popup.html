<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClarityOne</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" role="main" aria-label="ClarityOne accessibility settings">
      <h1>ClarityOne</h1>

      <div class="row site-override-row" id="siteOverrideRow" hidden>
        <label class="row" for="siteOverride">
          <span>Custom settings for <strong id="hostnameLabel"></strong></span>
        </label>
        <input id="siteOverride" type="checkbox" aria-label="Enable custom settings for this site" />
      </div>

      <label class="row toggle-row">
        <span>Enable accessibility mode</span>
        <input id="enabled" type="checkbox" aria-label="Enable accessibility mode" />
      </label>

      <label class="stack">
        <span>Contrast mode</span>
        <select id="contrastMode" aria-label="Contrast mode">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="yellow">Yellow on black</option>
          <option value="invert">Invert</option>
        </select>
      </label>

      <label class="stack">
        <span>Color-blind assist</span>
        <select id="colorBlindMode" aria-label="Color-blind assist mode">
          <option value="none">None</option>
          <option value="deuteranopia">Deuteranopia assist</option>
          <option value="protanopia">Protanopia assist</option>
          <option value="tritanopia">Tritanopia assist</option>
        </select>
      </label>

      <label class="stack">
        <span>Font scale</span>
        <input id="fontScale" type="range" min="1" max="2" step="0.1" aria-label="Font scale" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1.2" />
        <output id="fontScaleValue" aria-live="polite">1.2x</output>
      </label>

      <label class="stack">
        <span>Line height</span>
        <input id="lineHeight" type="range" min="1" max="3" step="0.1" aria-label="Line height" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1.7" />
        <output id="lineHeightValue" aria-live="polite">1.7</output>
      </label>

      <label class="stack">
        <span>Letter spacing</span>
        <input id="letterSpacing" type="range" min="0" max="0.2" step="0.01" aria-label="Letter spacing" aria-valuemin="0" aria-valuemax="0.2" aria-valuenow="0.02" />
        <output id="letterSpacingValue" aria-live="polite">0.02em</output>
      </label>

      <label class="stack">
        <span>Word spacing</span>
        <input id="wordSpacing" type="range" min="0" max="0.4" step="0.01" aria-label="Word spacing" aria-valuemin="0" aria-valuemax="0.4" aria-valuenow="0.05" />
        <output id="wordSpacingValue" aria-live="polite">0.05em</output>
      </label>

      <label class="stack">
        <span>Paragraph spacing</span>
        <input id="paragraphSpacing" type="range" min="0.8" max="2.4" step="0.1" aria-label="Paragraph spacing" aria-valuemin="0.8" aria-valuemax="2.4" aria-valuenow="1.2" />
        <output id="paragraphSpacingValue" aria-live="polite">1.2em</output>
      </label>

      <label class="row toggle-row">
        <span>Readable font</span>
        <input id="readableFont" type="checkbox" aria-label="Readable font" />
      </label>

      <label class="row toggle-row">
        <span>Dyslexia-friendly font</span>
        <input id="dyslexiaFont" type="checkbox" aria-label="Dyslexia-friendly font" />
      </label>

      <label class="row toggle-row">
        <span>Enhanced focus</span>
        <input id="enhancedFocus" type="checkbox" aria-label="Enhanced focus" />
      </label>

      <label class="row toggle-row">
        <span>Reading mode</span>
        <input id="readingMode" type="checkbox" aria-label="Reading mode" />
      </label>

      <section class="stack audit-section" aria-label="Accessibility audit">
        <button id="scanButton" type="button" aria-label="Scan this page for accessibility issues">Scan this page</button>
        <p id="scanSummary" class="scan-summary" aria-live="polite"></p>
        <div id="scanResults" class="scan-results" aria-live="polite"></div>
      </section>

      <button id="resetButton" type="button" aria-label="Reset all settings to defaults">Reset to defaults</button>
      <p class="credit" aria-label="Creator attribution">Created by Tarun Agarwal</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
